server {
    listen 8080;
    server_name _;

    # Web root = the generated simple-streams tree (mounted as a volume).
    root /usr/share/nginx/html;
    index index.json;

    # Allow directory listing so clients/tools can browse the tree.
    autoindex on;

    # Essential for Incus simple-streams clients:
    #  - correct JSON content-type
    #  - no caching of metadata so updates propagate immediately
    location ~* \.json$ {
        add_header Content-Type "application/json; charset=utf-8" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
