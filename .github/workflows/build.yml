name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ALPINE_VERSION: "3.24"
  DEBIAN_VERSION: "13"
  ALPINE_OPENSSH_FIXED_VERSION: "10.3_p1-r2"
  DISTROBUILDER_COMMIT: "9c74504399cbd09514c62a49d43ff0cf72619ecf"

jobs:
  validate:
    name: Validate Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check declared releases and SSH policy
        run: |
          test "$(tr -d '[:space:]' < VERSION)" = "$ALPINE_VERSION"
          test "$(tr -d '[:space:]' < debian/VERSION)" = "$DEBIAN_VERSION"
          for f in common/sshd_config debian/incus.yaml; do
            grep -q '^ *PermitRootLogin yes' "$f"
            grep -q '^ *PasswordAuthentication yes' "$f"
            grep -q '^ *PermitEmptyPasswords no' "$f"
          done
          ! grep -q '^ *UsePAM ' common/sshd_config
          grep -q 'UsePAM no' debian/Containerfile
          ! grep -q '^ *UsePAM ' incus/image.yaml
          grep -q 'cloud-init' incus/image.yaml
          grep -q 'htop' incus/image.yaml
          grep -q 'ncurses-terminfo-base' incus/image.yaml
          grep -q 'TERM=xterm-256color' incus/image.yaml
          grep -q 'cloud-init' debian/incus.yaml
          grep -q 'debian:13-slim' debian/Containerfile
      - name: Shell and Python syntax checks
        run: |
          for f in common/setup-base.sh podman/entrypoint.sh scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/generate-streams.py scripts/generate-runman-feed.py scripts/validate-runman-feed.py scripts/validate-streams.py
      - name: Validate combined Alpine and Debian simple-streams
        run: |
          for spec in alpine-amd64 alpine-arm64 debian-amd64 debian-arm64; do
            mkdir -p "/tmp/$spec"
            printf '%s-meta' "$spec" >"/tmp/$spec/incus.tar.xz"
            printf '%s-rootfs' "$spec" >"/tmp/$spec/rootfs.squashfs"
          done
          python3 scripts/generate-streams.py --clean --output-dir /tmp/streams --build-id 20260904_000000 \
            --image alpine:${ALPINE_VERSION}:amd64:/tmp/alpine-amd64 \
            --image alpine:${ALPINE_VERSION}:arm64:/tmp/alpine-arm64 \
            --image debian:${DEBIAN_VERSION}:amd64:/tmp/debian-amd64 \
            --image debian:${DEBIAN_VERSION}:arm64:/tmp/debian-arm64
          python3 scripts/validate-streams.py /tmp/streams
          python3 - <<'PY'
          import json
          with open('/tmp/streams/streams/v1/images.json') as f:
              assert set(json.load(f)['products']) == {
                  'alpine:3.24:amd64:default', 'alpine:3.24:arm64:default',
                  'debian:13:amd64:default', 'debian:13:arm64:default',
              }
          PY
      - name: Check ignore rules
        run: |
          grep -q 'output/' .gitignore
          grep -q '\.env' .gitignore
          grep -q '\*\.key' .gitignore

  build-podman:
    name: Build Podman ${{ matrix.distro }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { distro: alpine, version: "3.24", image: alpine-base }
          - { distro: debian, version: "13", image: debian-base }
    steps:
      - uses: actions/checkout@v7
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Build OCI image
        run: ./scripts/build-podman.sh "${{ matrix.distro }}" "localhost/${{ matrix.image }}:${{ matrix.version }}-test"
      - name: Test SSH password image contract
        run: |
          printf '%s' 'TestPassword123!' >/tmp/root_password
          podman secret create root_password /tmp/root_password
          podman run -d --name image-ci-test -p 2222:22 --secret root_password,target=root_password \
            "localhost/${{ matrix.image }}:${{ matrix.version }}-test"
          sleep 5
          test "$(podman inspect image-ci-test --format='{{.State.Status}}')" = running
          podman exec image-ci-test sh -c 'ss -lntp | grep :22 || netstat -tlnp | grep :22'
          podman exec image-ci-test sshd -T | grep '^permitrootlogin yes'
          podman exec image-ci-test sshd -T | grep '^passwordauthentication yes'
          if [ "${{ matrix.distro }}" = alpine ]; then
            installed="$(podman exec image-ci-test awk '
              /^P:openssh-server$/ { wanted=1; next }
              wanted && /^V:/ { sub(/^V:/, ""); print; exit }
              wanted && /^[A-Z]:/ { wanted=0 }
            ' /lib/apk/db/installed)"
            printf 'Built OpenSSH server package version: %s\n' "$installed"
            test "$installed" = "$ALPINE_OPENSSH_FIXED_VERSION"
          fi
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          stable="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}"
          latest="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest"
          podman tag "localhost/${{ matrix.image }}:${{ matrix.version }}-test" "$stable"
          podman tag "localhost/${{ matrix.image }}:${{ matrix.version }}-test" "$latest"
          podman push "$stable" && podman push "$latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            immutable="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}-${GITHUB_REF#refs/tags/v}"
            podman tag "localhost/${{ matrix.image }}:${{ matrix.version }}-test" "$immutable"
            podman push "$immutable"
          fi
      - name: Save OCI image artifact
        run: |
          mkdir -p output/podman
          podman save -o "output/podman/${{ matrix.image }}-${{ matrix.version }}-podman.tar" \
            "localhost/${{ matrix.image }}:${{ matrix.version }}-test"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro }}-${{ matrix.version }}-podman
          path: output/podman/${{ matrix.image }}-${{ matrix.version }}-podman.tar
          if-no-files-found: error
      - name: Cleanup
        if: always()
        run: |
          podman rm -f image-ci-test 2>/dev/null || true
          podman secret rm root_password 2>/dev/null || true

  build-incus:
    name: Build Incus ${{ matrix.distro }} ${{ matrix.arch }} image
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { distro: alpine, version: "3.24", arch: amd64, metadata_arch: x86_64, elf_pattern: x86-64, runner: ubuntu-24.04 }
          - { distro: alpine, version: "3.24", arch: arm64, metadata_arch: aarch64, elf_pattern: "ARM aarch64", runner: ubuntu-24.04-arm }
          - { distro: debian, version: "13", arch: amd64, metadata_arch: x86_64, elf_pattern: x86-64, runner: ubuntu-24.04 }
          - { distro: debian, version: "13", arch: arm64, metadata_arch: aarch64, elf_pattern: "ARM aarch64", runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned distrobuilder source
        uses: actions/checkout@v7
        with:
          repository: lxc/distrobuilder
          ref: ${{ env.DISTROBUILDER_COMMIT }}
          path: distrobuilder-src
          persist-credentials: false
      - name: Set up Go for distrobuilder
        uses: actions/setup-go@v7
        with:
          go-version-file: distrobuilder-src/go.mod
          cache: false
      - name: Install distrobuilder
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc debootstrap rsync gpg squashfs-tools zstd make build-essential
          (cd distrobuilder-src && make)
          sudo install -m 0755 "$(go env GOPATH)/bin/distrobuilder" /usr/local/bin/distrobuilder
          distrobuilder --version
      - name: Build Incus image
        run: sudo ./scripts/build-incus.sh "${{ matrix.distro }}" "${{ matrix.arch }}"
      - name: Verify Incus rootfs image contract
        run: |
          metadata="output/incus/${{ matrix.distro }}/${{ matrix.arch }}/incus.tar.xz"
          test "$(tar -xOf "$metadata" metadata.yaml | awk '/^architecture:/ {print $2; exit}')" = "${{ matrix.metadata_arch }}"
          sudo unsquashfs -d "/tmp/${{ matrix.distro }}-${{ matrix.arch }}-incus-rootfs" \
            "output/incus/${{ matrix.distro }}/${{ matrix.arch }}/rootfs.squashfs" >/dev/null
          root="/tmp/${{ matrix.distro }}-${{ matrix.arch }}-incus-rootfs"
          file -L "$root/bin/sh" | grep -F '${{ matrix.elf_pattern }}'
          test -x "$root/usr/bin/cloud-init"
          grep -q 'datasource_list: \[ LXD, None \]' "$root/etc/cloud/cloud.cfg.d/90-incus-datasource.cfg"
          grep -q '^PermitRootLogin yes' "$root/etc/ssh/sshd_config"
          grep -q '^PasswordAuthentication yes' "$root/etc/ssh/sshd_config"
          if [ "${{ matrix.distro }}" = alpine ]; then
            test -x "$root/sbin/openrc" && test -x "$root/etc/init.d/sshd"
            test -x "$root/usr/bin/htop"
            test -f "$root/etc/profile.d/20-terminal-fallback.sh"
            grep -q 'TERM=xterm-256color' "$root/etc/profile.d/20-terminal-fallback.sh"
            openssh_version="$(awk '
              /^P:openssh-server$/ { wanted=1; next }
              wanted && /^V:/ { sub(/^V:/, ""); print; exit }
              wanted && /^[A-Z]:/ { wanted=0 }
            ' "$root/lib/apk/db/installed")"
            test "$openssh_version" = "$ALPINE_OPENSSH_FIXED_VERSION"
          else
            test -x "$root/usr/sbin/sshd" && test -e "$root/lib/systemd/system/ssh.service"
          fi
      - name: Package Runman Alpine rootfs
        if: matrix.distro == 'alpine'
        run: |
          root="/tmp/${{ matrix.distro }}-${{ matrix.arch }}-incus-rootfs"
          serial="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          sudo bash scripts/package-runman-rootfs.sh "$root" "${{ matrix.arch }}" "$serial" \
            "$ALPINE_OPENSSH_FIXED_VERSION" output/runman
      - uses: actions/upload-artifact@v7
        if: matrix.distro == 'alpine'
        with:
          name: alpine-${{ matrix.version }}-${{ matrix.arch }}-runman
          path: output/runman/rootfs-alpine-${{ matrix.arch }}-*.tar.zst
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.distro }}-${{ matrix.version }}-${{ matrix.arch }}-incus
          path: |
            output/incus/${{ matrix.distro }}/${{ matrix.arch }}/incus.tar.xz
            output/incus/${{ matrix.distro }}/${{ matrix.arch }}/rootfs.squashfs
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-podman, build-incus]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: alpine-3.24-amd64-incus, path: output/incus/alpine/amd64 }
      - uses: actions/download-artifact@v8
        with: { name: alpine-3.24-arm64-incus, path: output/incus/alpine/arm64 }
      - uses: actions/download-artifact@v8
        with: { name: debian-13-amd64-incus, path: output/incus/debian/amd64 }
      - uses: actions/download-artifact@v8
        with: { name: debian-13-arm64-incus, path: output/incus/debian/arm64 }
      - uses: actions/download-artifact@v8
        with: { name: alpine-3.24-amd64-runman, path: output/runman }
      - uses: actions/download-artifact@v8
        with: { name: alpine-3.24-arm64-runman, path: output/runman }
      - uses: actions/download-artifact@v8
        with: { name: alpine-3.24-podman, path: output/podman }
      - uses: actions/download-artifact@v8
        with: { name: debian-13-podman, path: output/podman }
      - name: Install Runman archive validator
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build and validate combined simple-streams tree
        run: |
          python3 scripts/generate-streams.py --clean --output-dir incus-server/www \
            --build-id "$(date -u +%Y%m%d)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --image alpine:${ALPINE_VERSION}:amd64:output/incus/alpine/amd64 \
            --image alpine:${ALPINE_VERSION}:arm64:output/incus/alpine/arm64 \
            --image debian:${DEBIAN_VERSION}:amd64:output/incus/debian/amd64 \
            --image debian:${DEBIAN_VERSION}:arm64:output/incus/debian/arm64
          python3 scripts/validate-streams.py incus-server/www
          runman_serial="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          python3 scripts/generate-runman-feed.py \
            --input-dir output/runman --output-dir incus-server/www/runman \
            --version "$ALPINE_VERSION" --serial "$runman_serial"
          python3 scripts/validate-runman-feed.py incus-server/www/runman
          tar -czf runman-feed.tar.gz -C incus-server/www/runman .
          tar -czf incus-streams.tar.gz -C incus-server/www .
          # Keep the original Alpine asset names for existing install.sh users.
          cp output/incus/alpine/amd64/incus.tar.xz incus.tar.xz
          cp output/incus/alpine/amd64/rootfs.squashfs rootfs.squashfs
          cp output/incus/alpine/arm64/incus.tar.xz alpine-3.24-arm64-incus.tar.xz
          cp output/incus/alpine/arm64/rootfs.squashfs alpine-3.24-arm64-rootfs.squashfs
          cp output/incus/debian/amd64/incus.tar.xz debian-13-incus.tar.xz
          cp output/incus/debian/amd64/rootfs.squashfs debian-13-rootfs.squashfs
          cp output/incus/debian/arm64/incus.tar.xz debian-13-arm64-incus.tar.xz
          cp output/incus/debian/arm64/rootfs.squashfs debian-13-arm64-rootfs.squashfs
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(
            incus.tar.xz rootfs.squashfs
            alpine-3.24-arm64-incus.tar.xz alpine-3.24-arm64-rootfs.squashfs
            debian-13-incus.tar.xz debian-13-rootfs.squashfs
            debian-13-arm64-incus.tar.xz debian-13-arm64-rootfs.squashfs
            incus-streams.tar.gz
            runman-feed.tar.gz
            output/podman/alpine-base-${ALPINE_VERSION}-podman.tar
            output/podman/debian-base-${DEBIAN_VERSION}-podman.tar
          )
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "${GITHUB_REF#refs/tags/}" "${assets[@]}" --generate-notes
          else
            gh release delete continuous --yes 2>/dev/null || true
            gh release create continuous --target "$GITHUB_SHA" --prerelease \
              --title "Continuous build" \
              --notes "Rolling Alpine 3.24 + Debian 13 build from ${GITHUB_SHA}." \
              "${assets[@]}"
          fi
