name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ALPINE_VERSION: "3.24"

jobs:
  # --- Syntax & structure checks (always run) ---
  validate:
    name: Validate Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check VERSION file
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          echo "Alpine version: $VER"
          if [ "$VER" != "$ALPINE_VERSION" ]; then
            echo "ERROR: VERSION mismatch"
            exit 1
          fi

      - name: Check sshd_config
        run: |
          grep -q '^PermitRootLogin yes' common/sshd_config
          grep -q '^PasswordAuthentication yes' common/sshd_config
          grep -q '^PermitEmptyPasswords no' common/sshd_config
          echo "sshd_config validated"

      - name: Check packages.txt
        run: |
          grep -q 'openssh-server' common/packages.txt
          grep -q 'shadow' common/packages.txt
          echo "packages.txt validated"

      - name: Shell syntax check
        run: |
          for f in common/setup-base.sh \
                   podman/entrypoint.sh \
                   scripts/*.sh; do
            sh -n "$f" && echo "OK: $f"
          done

      - name: Check .gitignore
        run: |
          grep -q 'output/' .gitignore
          grep -q '\.env' .gitignore
          grep -q '\*\.key' .gitignore
          echo ".gitignore validated"

  # --- Podman OCI build (P1, second phase) ---
  build-podman:
    name: Build Podman Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Build OCI image
        run: |
          ./scripts/build-podman.sh "localhost/flanker-alpine-ssh:${ALPINE_VERSION}-test"

      - name: Test container starts
        run: |
          printf '%s' 'TestPassword123!' > /tmp/root_password
          podman secret create alpine_root_password /tmp/root_password
          podman run -d --name alpine-ci-test \
            -p 2222:22 \
            --secret alpine_root_password,target=root_password \
            localhost/flanker-alpine-ssh:${ALPINE_VERSION}-test
          sleep 5
          STATUS=$(podman inspect alpine-ci-test --format='{{.State.Status}}')
          echo "Container status: $STATUS"
          podman logs alpine-ci-test
          if [ "$STATUS" != "running" ]; then
            echo "ERROR: container did not stay running (status=$STATUS)"
            podman inspect alpine-ci-test --format='{{.State.ExitCode}}: {{.State.Error}}'
            exit 1
          fi

      - name: Verify sshd listening
        run: |
          podman ps -a
          podman inspect alpine-ci-test --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
          podman exec alpine-ci-test sh -c 'ss -lntp | grep :22 || netstat -tlnp | grep :22'
          podman exec alpine-ci-test sshd -T | grep '^permitrootlogin yes'
          podman exec alpine-ci-test sshd -T | grep '^passwordauthentication yes'

      - name: Push to GHCR (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          TAG=$(echo "${GITHUB_REF#refs/tags/}" | tr -d 'v')
          podman tag localhost/flanker-alpine-ssh:${ALPINE_VERSION}-test \
            ghcr.io/${{ github.repository_owner }}/flanker-alpine-ssh:${ALPINE_VERSION}-${TAG}
          podman push ghcr.io/${{ github.repository_owner }}/flanker-alpine-ssh:${ALPINE_VERSION}-${TAG}

      - name: Cleanup
        if: always()
        run: |
          podman rm -f alpine-ci-test 2>/dev/null || true
          podman secret rm alpine_root_password 2>/dev/null || true

  # --- Incus image build ---
  # distrobuilder only needs a Linux host; Incus daemon is NOT required to
  # produce the image tarball. The resulting artifact can be imported with:
  #   incus image import incus.tar.xz rootfs.squashfs --alias flanker-alpine/3.24-test
  # Full SSH verification still requires a host with Incus installed.
  build-incus:
    name: Build Incus Image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ensure scripts are executable
        run: chmod +x scripts/*.sh

      - name: Install distrobuilder (snap)
        run: |
          sudo apt-get update
          sudo apt-get install -y snapd
          sudo snap install distrobuilder --classic

      - name: Build Incus image
        run: |
          sudo ./scripts/build-incus.sh

      - name: Upload Incus image artifacts
        uses: actions/upload-artifact@v5
        with:
          name: flanker-alpine-3.24-incus
          path: |
            output/incus/incus.tar.xz
            output/incus/rootfs.squashfs
          if-no-files-found: error
